name: testes

on:
  push:
    paths:
      - "lab03/**"
      - "lab04/**"
      - "requirements.txt"
      - ".github/workflows/testes.yml"
  pull_request:
    paths:
      - "lab03/**"
      - "lab04/**"
      - "requirements.txt"
      - ".github/workflows/testes.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: pytest lab03/tests --cov=lab03/metricas --cov-report=term-missing --cov-fail-under=80

      - name: Testes do lab04
        run: pytest lab04/tests

      - name: Comando único do lab04
        run: python -m lab04
